<!DOCTYPE
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IncluIAê - Tradutor de Gestos e Faces (Estático e Dinâmico)</title>
    <meta name="description" content="Tecnologia de reconhecimento de gestos e faces com IA para inclusão e acessibilidade" />
    <link rel="stylesheet" href="style.css" />

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <img src="Vetor Logo.png" alt="IncluIAê Logo" class="logo-img" onerror="this.style.display='none'">
                    <span class="brand-title">IncluIAê</span>
                </div>
                <div class="badge">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span>Tradutor de Gestos e Faces</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="grid">
                <div class="video-section">
                    <div class="section-header">
                        <div class="icon-circle icon-circle-primary">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                            </svg>
                        </div>
                        <div>
                            <h2 class="section-title">Detecção em Tempo Real</h2>
                            <p class="section-subtitle" id="detectionSubtitle">Pressione Iniciar Câmera para começar</p>
                        </div>
                    </div>

                    <div class="video-card">
                        <div class="video-feed-container" style="position:relative;">
                            <video class="input_video" id="input_video" autoplay playsinline muted style="display:none;"></video>
                            <canvas class="output_canvas" id="output_canvas" width="640" height="480" style="width:100%; height:auto; background:#000;"></canvas>

                            <div class="video-placeholder" id="videoPlaceholder" style="position:absolute; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
                                <div id="initial-status" style="text-align:center; color:#fff;">
                                    <div class="hand-indicator" style="margin-bottom:12px;">
                                        <div class="pulse-ring" style="width:72px; height:72px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); margin:0 auto;"></div>
                                        <svg class="icon hand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px; height:48px; margin-top:-60px;">
                                            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                                            <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                                            <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                                            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                                        </svg>
                                    </div>
                                    <div class="text-center">
                                        <p class="status-title" style="font-weight:700;">Pronto para iniciar</p>
                                        <p class="status-text">Clique em Iniciar Câmera para começar</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="camera-indicator" style="margin-top:8px; display:flex; align-items:center; gap:8px;">
                            <div class="status-dot inactive" id="statusDot" style="width:12px; height:12px; border-radius:50%; background:#e74c3c;"></div>
                            <span class="status-label" id="statusLabel">Inativo</span>
                        </div>

                        <div class="recording-progress" id="recordingProgress" style="display: none; margin-top:8px;">
                            <div class="progress-bar" style="background:#eee; width:100%; height:10px; border-radius:6px; overflow:hidden;">
                                <div class="progress-fill" id="progressFill" style="height:100%; width:0%; background:#4caf50;"></div>
                            </div>
                            <span class="progress-text" id="progressText" style="display:block; margin-top:6px;">Gravando...</span>
                        </div>
                    </div>

                    <div class="button-group" style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="btn btn-primary" id="toggleCamera">Iniciar Câmera</button>
                        <button class="btn btn-secondary" id="cadastrarLibras">Cadastrar Gesto (Libras)</button>
                        <button class="btn btn-secondary" id="cadastrarFaces">Cadastrar Face</button>
                        <button class="btn btn-warning" id="pararCadastro">Parar Cadastro</button>
                    </div>

                    <div class="control-group" style="margin-top:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <label class="control-item" style="display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="ttsToggle" checked> Ativar Voz (TTS)
                        </label>
                        <button class="btn btn-outline-danger" id="limparDados">Limpar Dados</button>
                        <label class="control-item" style="display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="toggleLines" checked> Mostrar Desenho
                        </label>
                    </div>
                </div>

                <div class="info-section">
                    <div class="section-header">
                        <div class="icon-circle icon-circle-secondary">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <div>
                            <h2 class="section-title">Status e Dados</h2>
                            <p class="section-subtitle">Gestão de conhecimento do sistema</p>
                        </div>
                    </div>

                    <div class="info-card" style="margin-top:8px;">
                        <div class="status-display" id="recognitionStatus" style="padding:8px; background:#f5f5f5; border-radius:6px;">
                            Status: Aguardando Início...
                        </div>

                        <div class="status-display" id="currentSentenceDisplay" style="margin-top:8px; min-height:48px; padding:8px; background:#fff; border-radius:6px; border:1px solid #eee;">
                            <!-- conteúdo dinâmico -->
                        </div>

                        <div style="margin-top:12px;">
                            <h3>Dados cadastrados</h3>
                            <ul id="gesturesList"></ul>
                            <ul id="facesList"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
(function(){
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const detectionSubtitle = document.getElementById('detectionSubtitle');
    const videoPlaceholder = document.getElementById('videoPlaceholder');

    const toggleCameraBtn = document.getElementById('toggleCamera');
    const cadastrarLibrasBtn = document.getElementById('cadastrarLibras');
    const cadastrarFacesBtn = document.getElementById('cadastrarFaces');
    const pararCadastroBtn = document.getElementById('pararCadastro');
    const limparDadosBtn = document.getElementById('limparDados');
    const toggleLinesCheckbox = document.getElementById('toggleLines');
    const ttsToggle = document.getElementById('ttsToggle');

    const recordingProgress = document.getElementById('recordingProgress');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    const recognitionStatus = document.getElementById('recognitionStatus');
    const currentSentenceDisplay = document.getElementById('currentSentenceDisplay');
    const gesturesList = document.getElementById('gesturesList');
    const facesList = document.getElementById('facesList');

    let camera = null;
    let running = false;

    // storage for registrations
    const gesturesDB = [];
    const facesDB = [];

    let registering = false;
    let registerMode = null; // 'gesture' or 'face'
    let registerFrames = [];
    let registerStart = 0;
    const REGISTER_DURATION_MS = 3000;

    // initialize MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
    });
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    // initialize FaceMesh
    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`
    });
    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    // results handling
    function onResults(resultsHands, resultsFace) {
        // clear canvas
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        // draw image
        if (resultsHands && resultsHands.image) {
            canvasCtx.drawImage(resultsHands.image, 0, 0, canvasElement.width, canvasElement.height);
        } else if (resultsFace && resultsFace.image) {
            canvasCtx.drawImage(resultsFace.image, 0, 0, canvasElement.width, canvasElement.height);
        }

        const showLines = toggleLinesCheckbox.checked;
        if (showLines) {
            if (resultsFace && resultsFace.multiFaceLandmarks) {
                for (const landmarks of resultsFace.multiFaceLandmarks) {
                    drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#00FF00', lineWidth: 1});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 0.5, radius: 1});
                }
            }
            if (resultsHands && resultsHands.multiHandLandmarks) {
                for (const landmarks of resultsHands.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});
                }
            }
        }

        canvasCtx.restore();

        // registration logic: capture normalized landmark arrays
        if (registering) {
            const now = performance.now();
            // capture a snapshot of current landmarks (hands priority)
            let snapshot = null;
            if (resultsHands && resultsHands.multiHandLandmarks && resultsHands.multiHandLandmarks.length) {
                snapshot = resultsHands.multiHandLandmarks.map(hand => hand.map(p => ({x:p.x, y:p.y, z:p.z})));
            } else if (resultsFace && resultsFace.multiFaceLandmarks && resultsFace.multiFaceLandmarks.length) {
                snapshot = resultsFace.multiFaceLandmarks[0].map(p => ({x:p.x, y:p.y, z:p.z}));
            } else {
                snapshot = null;
            }
            if (snapshot) registerFrames.push({t: now, data: snapshot});
            const elapsed = now - registerStart;
            const pct = Math.min(100, (elapsed / REGISTER_DURATION_MS) * 100);
            progressFill.style.width = pct + '%';
            if (elapsed >= REGISTER_DURATION_MS) {
                finishRegistration();
            }
        }

        // very simple recognition placeholder: show counts
        const handsCount = (resultsHands && resultsHands.multiHandLandmarks) ? resultsHands.multiHandLandmarks.length : 0;
        const facesCount = (resultsFace && resultsFace.multiFaceLandmarks) ? resultsFace.multiFaceLandmarks.length : 0;
        recognitionStatus.textContent = `Mãos detectadas: ${handsCount} • Faces detectadas: ${facesCount}`;
    }

    // We will bridge MediaPipe results for both models by calling both and combining data where needed.
    hands.onResults((rh) => {
        // call faceMesh.send asynchronously; but results will be handled separately; here call unified drawing using last face results
        onResults(rh, lastFaceResults);
    });

    let lastFaceResults = null;
    faceMesh.onResults((rf) => {
        lastFaceResults = rf;
        // use last hands results from hands (MediaPipe passes images back), but we rely on hands.onResults to handle combined drawing
        // call onResults with last hands results if available
        onResults(lastHandsResults, rf);
    });

    let lastHandsResults = null;
    hands.onResults((rh) => {
        lastHandsResults = rh;
        onResults(rh, lastFaceResults);
    });

    // Camera loop: feed frames to both processors
    function startCamera() {
        if (camera) return;
        camera = new Camera(videoElement, {
            onFrame: async () => {
                try {
                    await hands.send({image: videoElement});
                    await faceMesh.send({image: videoElement});
                } catch (e) {
                    console.warn('MP error', e);
                }
            },
            width: 640,
            height: 480
        });
        camera.start();
        running = true;
        videoElement.style.display = 'block';
        videoPlaceholder.style.display = 'none';
        statusDot.style.background = '#2ecc71';
        statusLabel.textContent = 'Ativo';
        toggleCameraBtn.textContent = 'Parar Câmera';
        detectionSubtitle.textContent = 'Detecção em execução';
    }

    function stopCamera() {
        if (camera) {
            camera.stop();
            camera = null;
        }
        running = false;
        videoElement.style.display = 'none';
        videoPlaceholder.style.display = 'flex';
        statusDot.style.background = '#e74c3c';
        statusLabel.textContent = 'Inativo';
        toggleCameraBtn.textContent = 'Iniciar Câmera';
        detectionSubtitle.textContent = 'Pressione Iniciar Câmera para começar';
    }

    toggleCameraBtn.addEventListener('click', () => {
        if (!running) startCamera(); else stopCamera();
    });

    // registration controls
    cadastrarLibrasBtn.addEventListener('click', () => {
        if (!running) { alert('Inicie a câmera antes de cadastrar.'); return; }
        startRegistration('gesture');
    });
    cadastrarFacesBtn.addEventListener('click', () => {
        if (!running) { alert('Inicie a câmera antes de cadastrar.'); return; }
        startRegistration('face');
    });
    pararCadastroBtn.addEventListener('click', () => {
        if (registering) stopRegistration();
    });

    limparDadosBtn.addEventListener('click', () => {
        gesturesDB.length = 0;
        facesDB.length = 0;
        renderDBLists();
    });

    function startRegistration(mode) {
        registering = true;
        registerMode = mode;
        registerFrames = [];
        registerStart = performance.now();
        recordingProgress.style.display = 'block';
        progressFill.style.width = '0%';
        progressText.textContent = `Gravando ${mode}...`;
    }

    function finishRegistration() {
        registering = false;
        recordingProgress.style.display = 'none';
        if (registerFrames.length === 0) {
            alert('Nenhum dado capturado. Tente novamente com a mão/face visível.');
            return;
        }
        // simple summarization: store first captured frame
        const sample = registerFrames[Math.floor(registerFrames.length / 2)].data;
        if (registerMode === 'gesture') {
            gesturesDB.push({id: Date.now(), sample});
            speakIfEnabled('Gesto cadastrado.');
        } else if (registerMode === 'face') {
            facesDB.push({id: Date.now(), sample});
            speakIfEnabled('Face cadastrada.');
        }
        renderDBLists();
        registerMode = null;
        registerFrames = [];
    }

    function stopRegistration() {
        if (registering) {
            registering = false;
            recordingProgress.style.display = 'none';
            registerMode = null;
            registerFrames = [];
            speakIfEnabled('Cadastro interrompido.');
        }
    }

    // expose stopRegistration globally because original HTML had onclick reference
    window.stopRegistration = stopRegistration;

    function renderDBLists() {
        gesturesList.innerHTML = '';
        facesList.innerHTML = '';
        gesturesDB.forEach(g => {
            const li = document.createElement('li');
            li.textContent = `Gesto ${g.id} (exemplos: 1)`;
            gesturesList.appendChild(li);
        });
        facesDB.forEach(f => {
            const li = document.createElement('li');
            li.textContent = `Face ${f.id} (exemplos: 1)`;
            facesList.appendChild(li);
        });
    }

    function speakIfEnabled(text) {
        if (!ttsToggle.checked) return;
        if (!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'pt-BR';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }

    // ensure canvas scales to video
    function resizeCanvas() {
        const rect = canvasElement.getBoundingClientRect();
        canvasElement.width = rect.width * devicePixelRatio;
        canvasElement.height = rect.height * devicePixelRatio;
        canvasCtx.scale(devicePixelRatio, devicePixelRatio);
    }
    window.addEventListener('resize', () => {
        // keep canvas resolution usable
        // small debounce
        clearTimeout(window._resizeTimeout);
        window._resizeTimeout = setTimeout(resizeCanvas, 150);
    });
    // initial resize
    setTimeout(resizeCanvas, 200);

    // clean up on unload
    window.addEventListener('beforeunload', () => {
        stopRegistration();
        stopCamera();
    });

    // set initial UI
    renderDBLists();
})();
</script>
</body>
</html>
